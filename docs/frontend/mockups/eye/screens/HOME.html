<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — トップ（共有端末）</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  /* 主操作は2つだけ。右と下が空いているのは正しい状態なので、埋めない。 */
  .home {
    height: 100%;
    display: grid;
    align-content: center;
    justify-content: start;
    gap: 24px;
    padding: 0 44px 124px;
  }
  .big {
    width: 720px;
    display: flex;
    align-items: center;
    gap: 22px;
    min-height: 132px;
    padding: 0 32px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-l);
    background: var(--surface);
    text-align: left;
    font: 700 28px var(--sans);
    color: var(--ink);
  }
  .big small { display: block; font: 400 15px var(--sans); color: var(--ink-2); margin-top: 4px; }
  .big .ico {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 28px;
  }
  .big.change .ico { background: var(--walkin); }

  /* 日付の帯は画面の下辺に置く。 */
  .days { position: absolute; left: 44px; right: 44px; bottom: 44px; }
  .days .month { margin: 0 0 16px; font-size: 14px; color: var(--ink-2); }
  .strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .day {
    min-height: 76px; border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); display: grid; place-content: center; text-align: center;
    font: 600 22px var(--sans); color: var(--ink);
  }
  .day small { display: block; font: 600 12px var(--sans); color: var(--ink-2); }
  .day.on { border: 3px solid var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
  .day.sun, .day.sun small { color: var(--alert); }
  .day.cal { font-size: 14px; color: var(--brand); }
</style>
</head>
<body>
<div class="caption">
  <h1>トップ（レジ横の共有端末）</h1>
  <p>電話が鳴ってから予約を取り始めるまでの判断を減らす面。主操作は2つだけに絞り、行き先は左のサイドバーが持つ。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>9:41</span><span>EYE 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="トップへ">⌂</button>
    <div class="storename">EYE 銀座店<small>営業中　10:00–19:00</small></div>
    <div class="barbtns">
      <button class="barbtn"><b>お知らせ</b><span class="badge">3</span></button>
    </div>
  </header>

  <div class="body">
    <div class="shell">
      <nav class="sidenav" aria-label="画面の切り替え">
        <button class="navtoggle" aria-label="サイドバーをたたむ">たたむ</button>
        <button class="nav-item on" data-icon="home">トップ</button>
        <button class="new">予約を取る</button>
        <button class="nav-item" data-icon="ledger">予約台帳</button>
        <button class="nav-item" data-icon="reception">来店受付</button>
        <button class="nav-item" data-icon="search">予約を検索</button>
        <button class="nav-item" data-icon="history">受付履歴</button>
        <button class="nav-item" data-icon="customer">顧客台帳</button>
        <div class="group">お店の運用</div>
        <button class="nav-item" data-icon="analytics">分析</button>
        <button class="nav-item" data-icon="settings">設定</button>
        <div class="foot">銀座店 レジ横iPad<br>共有で使っています</div>
      </nav>

      <div class="content">
        <div class="inner">
          <div class="home">
            <button class="big"><span class="ico" aria-hidden="true">☎</span><span>新しい予約を取る<small>お電話・ご来店のお客様</small></span></button>
            <button class="big change"><span class="ico" aria-hidden="true">✎</span><span>予約を変更する<small>日時・内容の変更、取り消し</small></span></button>
          </div>

          <div class="days">
            <p class="month">2026年 8月</p>
            <div class="strip">
              <button class="day"><small>月</small>24</button>
              <button class="day"><small>火</small>25</button>
              <button class="day"><small>水</small>26</button>
              <button class="day on"><small>木</small>27</button>
              <button class="day"><small>金</small>28</button>
              <button class="day"><small>土</small>29</button>
              <button class="day sun"><small>日</small>30</button>
              <button class="day cal">カレンダー<br>から選ぶ</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
