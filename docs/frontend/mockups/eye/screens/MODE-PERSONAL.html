<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — 共有端末で個人モードに切り替える</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  .mp { display: grid; grid-template-columns: 1fr 400px; height: 100%; }
  .left { padding: 40px 40px; display: flex; flex-direction: column; min-height: 0; }
  .padwrap {
    border-left: 1px solid var(--line); background: var(--surface);
    padding: 40px 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  .padwrap h3 { margin: 0; font-size: 15px; }

  .pickname { margin: 30px 0 0; }
  .tiles { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tile {
    display: flex; align-items: center; gap: 14px; text-align: left;
    min-height: 100px; padding: 14px 16px;
    border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font-family: var(--sans);
  }
  .tile.on { border: 3px solid var(--brand); background: var(--brand-tint); padding: 12px 14px; }
  .tile .av {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: var(--brand-tint); border: 1px solid var(--brand-line); color: var(--brand-dark);
    display: grid; place-items: center; font: 700 18px var(--sans);
  }
  .tile.on .av { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .tile .nm { font-size: 17px; font-weight: 700; }
  .tile .can { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .tile:disabled { background: var(--surface-2); color: var(--ink-3); border-style: dashed; }
  .tile:disabled .av { background: var(--busy); border-color: var(--line-strong); color: var(--ink-3); }
  .tile:disabled .can { color: var(--ink-3); }

  .bottom { margin-top: 32px; }
</style>
</head>
<body>
<div class="caption">
  <h1>共有端末で個人モードに切り替える</h1>
  <p>レジ横の共有端末でも、責任の残る操作の前だけご本人を確かめる。確かめたあとも2分さわらなければ共有に戻る。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>11:08</span><span>EYE 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="トップへ">⌂</button>
    <div class="storename">EYE 銀座店<small>銀座店 レジ横iPad（みんなで使う端末）</small></div>
    <div class="barbtns">
      <span class="tag">いまは共有モード</span>
      <button class="barbtn"><b>やめる</b></button>
    </div>
  </header>

  <div class="body">
    <div class="mp">
      <section class="left">
        <div class="ask">
          <span class="bubble" aria-hidden="true"></span>
          <div>
            <h2>録音の保全にはご本人の確認が必要です</h2>
            <p>操作するスタッフを選んでください。</p>
          </div>
        </div>

        <div class="tiles" role="group" aria-label="操作するスタッフ">
          <button class="tile on">
            <span class="av" aria-hidden="true">佐</span>
            <span><span class="nm">佐藤 美咲</span><span class="can">視力測定・加工</span></span>
          </button>
          <button class="tile">
            <span class="av" aria-hidden="true">高</span>
            <span><span class="nm">高橋 健</span><span class="can">フィッティング</span></span>
          </button>
          <button class="tile">
            <span class="av" aria-hidden="true">中</span>
            <span><span class="nm">中村 彩</span><span class="can">販売・受付</span></span>
          </button>
          <button class="tile">
            <span class="av" aria-hidden="true">小</span>
            <span><span class="nm">小林 学</span><span class="can">視力測定</span></span>
          </button>
          <button class="tile">
            <span class="av" aria-hidden="true">渡</span>
            <span><span class="nm">渡辺 由紀</span><span class="can">販売</span></span>
          </button>
          <button class="tile" disabled>
            <span class="av" aria-hidden="true">山</span>
            <span><span class="nm">山田 大輔（店長）</span><span class="can">店舗の管理　本日休み</span></span>
          </button>
        </div>

        <div class="bottom">
          <button class="btn">やめて台帳に戻る</button>
        </div>
      </section>

      <aside class="padwrap">
        <h3>佐藤 美咲 さんの暗証番号　4〜6桁</h3>
        <div class="pins" role="group" aria-label="暗証番号　6桁のうち2桁を入力済み">
          <i class="filled">●</i><i class="filled">●</i><i></i><i></i><i></i><i></i>
        </div>

        <div class="keypad" role="group" aria-label="暗証番号のテンキー">
          <button class="key">1</button><button class="key">2</button><button class="key">3</button>
          <button class="key">4</button><button class="key">5</button><button class="key">6</button>
          <button class="key">7</button><button class="key">8</button><button class="key">9</button>
          <button class="key wide">削除</button>
          <button class="key">0</button>
          <button class="key wide go" disabled>確定</button>
        </div>
      </aside>
    </div>
  </div>
</main>
</body>
</html>
