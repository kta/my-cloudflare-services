<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — Web予約 1/6 店舗を選ぶ</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  .ask h2 { font-size: 20px; }
  .ask p { font-size: 13px; }
  .ask .bubble { width: 18px; height: 15px; margin-top: 6px; }
  .wrap { padding: 32px 28px 120px; }
  .stores { display: grid; gap: 12px; margin-top: 28px; }
  .store {
    display: block; width: 100%; min-height: 76px; padding: 16px; text-align: left;
    border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font-family: var(--sans);
  }
  .store.on { border: 3px solid var(--brand); background: var(--brand-tint); padding: 14px; }
  .store .nm { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .store .sub { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
  .sticky { left: 28px; right: 28px; bottom: 32px; }
  .sticky .btn { width: 100%; }
</style>
</head>
<body>
<div class="caption">
  <h1>Web予約 1/6　店舗を選ぶ</h1>
  <p>お客様がご自身のスマートフォンから予約する画面。近い順の3店舗と、次の一手だけを置く。</p>
</div>

<main class="phone" id="screen">
  <div class="statusbar"><span>11:08</span><span></span><span>Wi‑Fi　86%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="前の画面へ戻る">‹</button>
    <div class="storename">EYE ご予約<small>ステップ 1 / 6　店舗</small></div>
  </header>

  <div class="webprogress" role="img" aria-label="全6ステップのうち1つ目です">
    <i class="on"></i><i></i><i></i><i></i><i></i><i></i>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="ask">
        <span class="bubble" aria-hidden="true"></span>
        <div>
          <h2>ご希望の店舗をお選びください</h2>
          <p>近い順に3店舗を表示しています。</p>
        </div>
      </div>

      <div class="stores">
        <button class="store on" aria-label="EYE 銀座店 選択中">
          <span class="nm">EYE 銀座店<span class="tag brand">選択中</span></span>
          <span class="sub">銀座駅 A2出口から徒歩3分</span>
        </button>
        <button class="store">
          <span class="nm">EYE 丸の内店</span>
          <span class="sub">東京駅 丸の内南口から徒歩5分</span>
        </button>
        <button class="store">
          <span class="nm">EYE 新宿店</span>
          <span class="sub">新宿駅 東口から徒歩4分</span>
        </button>
      </div>
    </div>

    <div class="sticky">
      <button class="btn primary big">銀座店で予約を進める</button>
    </div>
  </div>
</main>
</body>
</html>
