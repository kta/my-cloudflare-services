<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — Web予約 2/6 ご来店の目的</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  .ask h2 { font-size: 20px; }
  .ask p { font-size: 13px; }
  .ask .bubble { width: 18px; height: 15px; margin-top: 6px; }
  .wrap { padding: 32px 28px 120px; }
  .picks { display: grid; gap: 10px; margin-top: 28px; }
  .pick {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px;
    padding: 0 16px; text-align: left;
    border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font: 600 16px var(--sans);
  }
  .pick.on { border: 3px solid var(--brand); background: var(--brand-tint); padding: 0 14px; }
  .pick .min { margin-left: auto; text-align: right; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .pick .min em { display: block; font-style: normal; color: var(--brand-dark); }
  .sticky { left: 28px; right: 28px; bottom: 32px; }
  .sticky .btn { width: 100%; }
</style>
</head>
<body>
<div class="caption">
  <h1>Web予約 2/6　ご来店の目的</h1>
  <p>ご用件でお預かりするお時間が変わるので、目安の分数だけを添えて選んでいただく。</p>
</div>

<main class="phone" id="screen">
  <div class="statusbar"><span>11:09</span><span></span><span>Wi‑Fi　86%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="前の画面へ戻る">‹</button>
    <div class="storename">EYE 銀座店<small>ステップ 2 / 6　ご用件</small></div>
  </header>

  <div class="webprogress" role="img" aria-label="全6ステップのうち2つ目です">
    <i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="ask">
        <span class="bubble" aria-hidden="true"></span>
        <div>
          <h2>ご用件をお選びください</h2>
          <p>お時間は目安です。</p>
        </div>
      </div>

      <div class="picks">
        <button class="pick on" aria-label="メガネを新しく作る 約60分 選択中">
          メガネを新しく作る<span class="min">約60分<em>選択中</em></span>
        </button>
        <button class="pick">今のメガネを調整する<span class="min">約20分</span></button>
        <button class="pick">できあがりを受け取る<span class="min">約20分</span></button>
        <button class="pick">修理・部品の交換<span class="min">約30分</span></button>
        <button class="pick">コンタクトレンズのご相談<span class="min">約40分</span></button>
        <button class="pick">視力の測定だけ<span class="min">約30分</span></button>
      </div>
    </div>

    <div class="sticky">
      <button class="btn primary big">日時を選ぶ</button>
    </div>
  </div>
</main>
</body>
</html>
