<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — 業務を始める（個人の端末・暗証番号）</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  .pinwrap { display: grid; grid-template-columns: 1fr 420px; height: 100%; }
  .left { padding: 40px 44px; display: flex; flex-direction: column; min-height: 0; }
  .padwrap {
    border-left: 1px solid var(--line); background: var(--surface);
    padding: 40px 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  .who { display: flex; align-items: center; gap: 16px; }
  .who .av {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; font: 700 23px var(--sans);
  }
  .who .nm { font-size: 18px; font-weight: 700; }
  .who .nm small { display: block; margin-top: 3px; font: 400 13px var(--sans); color: var(--ink-2); }
  .pinblock { margin-top: 34px; }
  .pins { margin-top: 10px; }
  .bottom { margin-top: auto; }
</style>
</head>
<body>
<div class="caption">
  <h1>業務を始める（個人の端末・暗証番号）</h1>
  <p>選んだご本人であることを確かめる。左に「誰の番号を入れているか」、右に片手で押せるテンキーを置く。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>9:41</span><span>EYE 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <div class="storename">EYE 銀座店<small>業務を始める　個人の端末</small></div>
    <div class="barbtns">
      <button class="barbtn"><b>やめる</b></button>
    </div>
  </header>

  <div class="body">
    <div class="pinwrap">
      <section class="left">
        <div class="ask">
          <span class="bubble" aria-hidden="true"></span>
          <div>
            <h2>4〜6桁の暗証番号を入力してください</h2>
            <p>番号は誰にも見えないよう ● で表示します。</p>
          </div>
        </div>

        <div class="card tint">
          <div class="who">
            <span class="av" aria-hidden="true">佐</span>
            <span class="nm">佐藤 美咲<small>視力測定・加工　／　本日の勤務 10:00–19:00</small></span>
          </div>
        </div>

        <div class="pinblock">
          <span class="label" id="lbl-pin">暗証番号　4桁まで入力しました</span>
          <div class="pins" role="group" aria-labelledby="lbl-pin" aria-label="暗証番号　6桁のうち4桁を入力済み">
            <i class="filled">●</i><i class="filled">●</i><i class="filled">●</i><i class="filled">●</i><i></i><i></i>
          </div>
        </div>

        <div class="bottom">
          <button class="btn">別のスタッフを選ぶ</button>
        </div>
      </section>

      <aside class="padwrap">
        <div class="keypad" role="group" aria-label="暗証番号のテンキー">
          <button class="key">1</button><button class="key">2</button><button class="key">3</button>
          <button class="key">4</button><button class="key">5</button><button class="key">6</button>
          <button class="key">7</button><button class="key">8</button><button class="key">9</button>
          <button class="key wide">削除</button>
          <button class="key">0</button>
          <button class="key wide go">確定</button>
        </div>
        <p class="small muted" style="margin:0">「確定」で業務が始まります</p>
      </aside>
    </div>
  </div>
</main>
</body>
</html>
