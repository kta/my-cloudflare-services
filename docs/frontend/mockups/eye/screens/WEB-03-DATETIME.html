<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE予約 — Web予約 3/6 日にちと時間</title>
<link rel="stylesheet" href="../assets/eye.css">
<style>
  .ask h2 { font-size: 20px; }
  .ask p { font-size: 13px; }
  .ask .bubble { width: 18px; height: 15px; margin-top: 6px; }
  .wrap { padding: 32px 28px 120px; }
  .weeknav { display: flex; align-items: center; gap: 8px; margin: 28px 0 10px; }
  .weeknav b { flex: 1; text-align: center; font-size: 16px; }
  .weeknav button {
    width: 44px; height: 44px; border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink-2); font-size: 16px; font-family: inherit;
  }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dy {
    min-height: 64px; padding: 6px 0; border: 1px solid var(--line-strong); border-radius: var(--r-s);
    background: var(--surface); color: var(--ink); font: 700 20px var(--sans); text-align: center;
  }
  .dy small { display: block; font: 400 13px var(--sans); color: var(--ink-2); }
  .dy em { display: block; font: 600 13px var(--sans); font-style: normal; color: var(--ink-3); }
  .dy.on { border: 3px solid var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
  .dy.on small { color: var(--brand-dark); }
  .dy:disabled { background: var(--surface-2); color: var(--ink-3); }
  .dy:disabled small { color: var(--ink-3); }
  .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tm {
    min-height: 60px; padding: 6px 0; border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font: 700 16px var(--sans); text-align: center;
  }
  .tm em { display: block; font: 600 13px var(--sans); font-style: normal; color: var(--brand-dark); }
  .tm.on { border: 3px solid var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
  .tm:disabled { background: var(--surface-2); color: var(--ink-3); }
  .tm:disabled em { color: var(--ink-3); }
  .sticky { left: 28px; right: 28px; bottom: 32px; }
  .sticky .btn { width: 100%; }
</style>
</head>
<body>
<div class="caption">
  <h1>Web予約 3/6　日にちと時間</h1>
  <p>一週間ぶんの空き具合を先に見せてから時刻を選ばせる。選べない枠は押せない「満」にする。</p>
</div>

<main class="phone" id="screen">
  <div class="statusbar"><span>11:10</span><span></span><span>Wi‑Fi　86%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="前の画面へ戻る">‹</button>
    <div class="storename">EYE 銀座店<small>ステップ 3 / 6　日にちと時間</small></div>
  </header>

  <div class="webprogress" role="img" aria-label="全6ステップのうち3つ目です">
    <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="ask">
        <span class="bubble" aria-hidden="true"></span>
        <div>
          <h2>ご希望の日時をお選びください</h2>
          <p>約60分でご案内できる日時です。</p>
        </div>
      </div>

      <div class="weeknav">
        <button aria-label="前の週">‹</button>
        <b>8月27日 〜 9月2日</b>
        <button aria-label="次の週">›</button>
      </div>
      <div class="week">
        <button class="dy"><small>木</small>27</button>
        <button class="dy"><small>金</small>28</button>
        <button class="dy on"><small>土</small>29</button>
        <button class="dy"><small>日</small>30</button>
        <button class="dy"><small>月</small>31</button>
        <button class="dy" disabled><small>火</small>1<em>定休</em></button>
        <button class="dy"><small>水</small>2</button>
      </div>

      <h3 class="section-title" style="margin:28px 0 10px">8月29日（土）のお時間</h3>
      <div class="times">
        <button class="tm">10:00</button>
        <button class="tm">10:30</button>
        <button class="tm on">11:00<em>選択中</em></button>
        <button class="tm">11:30</button>
        <button class="tm" disabled>13:00<em>満</em></button>
        <button class="tm">13:30</button>
        <button class="tm">14:00</button>
        <button class="tm" disabled>14:30<em>満</em></button>
      </div>
    </div>

    <div class="sticky">
      <button class="btn primary big">お客様の情報を入力する</button>
    </div>
  </div>
</main>
</body>
</html>
