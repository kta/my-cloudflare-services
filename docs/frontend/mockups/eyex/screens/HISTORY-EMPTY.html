<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — 受付履歴（条件に合うものがない）</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .filters { display: flex; align-items: center; gap: 8px; }
  .fbtn {
    min-height: 40px; padding: 0 12px; border: 1px solid var(--line-strong);
    border-radius: var(--r-s); background: var(--surface); color: var(--ink);
    font: 600 13px var(--sans); display: flex; align-items: center; gap: 6px;
  }
  .fbtn small { font-weight: 400; color: var(--ink-2); }
  .fbtn.on { border: 2px solid var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
  .fbtn.on small { color: var(--brand-dark); }

  /* 左のサイドバー（216px）のぶん本文が狭いので、案内の幅を詰める。 */
  .wrap { height: 100%; display: grid; place-items: center; padding: 36px; }
  .panel { width: 640px; }
  .panel h2 { margin: 0; font-size: 24px; text-align: center; }
  .panel .lead { margin: 12px 0 0; font-size: 15px; color: var(--ink-2); text-align: center; }

  .srow { display: flex; align-items: center; gap: 14px; min-height: 62px; }
  .srow b { font-size: 16px; }
  .srow .cnt { margin-left: auto; font: 600 21px var(--mono); color: var(--brand-dark); }
  .srow .btn { flex: none; min-height: 44px; padding: 0 14px; font-size: 15px; }
</style>
</head>
<body>
<div class="caption">
  <h1>受付履歴（条件に合うものがない）</h1>
  <p>0件で行き止まりにしない。何を変えると何件見つかるかを先に示す。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>11:08</span><span>EYEX 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="トップへ">⌂</button>
    <div class="storename">EYEX 銀座店<small>受付履歴</small></div>
  </header>

  <div class="body">
    <div class="shell">
      <nav class="sidenav" aria-label="画面の切り替え">
        <button class="navtoggle" aria-label="サイドバーをたたむ">たたむ</button>
        <button class="new">＋ 予約を取る</button>
        <button class="nav-item" data-icon="ledger">予約台帳</button>
        <button class="nav-item" data-icon="reception">来店受付</button>
        <button class="nav-item" data-icon="search">予約を検索</button>
        <button class="nav-item on" data-icon="history">受付履歴</button>
        <button class="nav-item" data-icon="customer">顧客台帳</button>
        <div class="group">お店の運用</div>
        <button class="nav-item" data-icon="analytics">分析</button>
        <button class="nav-item" data-icon="settings">設定</button>
        <div class="foot">銀座店 レジ横iPad<br>共有で使っています</div>
      </nav>

      <div class="content">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="受付履歴の絞り込み">
            <button class="fbtn on">期間<small>8月25日 〜 8月26日</small></button>
            <button class="fbtn on">担当<small>佐藤 美咲</small></button>
            <button class="fbtn on">結果<small>取消</small></button>
          </div>
          <div class="right small muted">該当 0件</div>
        </div>

        <div class="inner">
          <div class="wrap">
            <section class="panel" aria-label="条件に合う受付履歴がないときの案内">
              <h2>条件に合う受付履歴はありませんでした</h2>
              <p class="lead">8月25日 〜 8月26日／担当 佐藤 美咲／結果 取消　で 0件でした。</p>

              <h3 class="section-title" style="margin:36px 0 6px">条件を変えると見つかります</h3>
              <div class="lines">
                <div class="srow">
                  <b>期間を「今月（8月1日 〜 8月27日）」まで広げる</b>
                  <span class="cnt">12件</span>
                  <button class="btn">この条件で見る</button>
                </div>
                <div class="srow">
                  <b>担当の「佐藤 美咲」を外す</b>
                  <span class="cnt">7件</span>
                  <button class="btn">この条件で見る</button>
                </div>
              </div>

              <div style="margin-top:32px">
                <button class="btn primary big">絞り込みをすべて外す（46件）</button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
