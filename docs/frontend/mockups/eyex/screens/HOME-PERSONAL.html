<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — トップ（個人の端末）</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  /* 「トップ」と「＋ 予約を取る」はどちらも緑の塊なので、少し離して別物に見せる。 */
  .sidenav .new { margin-top: 14px; }
  /* サイドバーぶん本文が狭くなったので、右の担当一覧を 400px → 340px に詰める。 */
  .home { display: grid; grid-template-columns: 1fr 340px; gap: 44px; padding: 40px 40px 0; }
  .hero { display: grid; gap: 24px; align-content: start; }
  .hero .big {
    display: flex; align-items: center; gap: 22px; min-height: 132px; padding: 0 32px;
    border: 1px solid var(--line-strong); border-radius: var(--r-l); background: var(--surface);
    text-align: left; font: 700 28px var(--sans); color: var(--ink);
  }
  .hero .big small { display: block; font: 400 15px var(--sans); color: var(--ink-2); margin-top: 4px; }
  .hero .big .ico { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--brand);
    color: #fff; display: grid; place-items: center; font-size: 28px; }
  .hero .big.change .ico { background: var(--walkin); }
  .mine h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .mine .lines > div { display: flex; gap: 14px; align-items: baseline; padding: 18px 0; }
  .mine .t { font: 600 17px var(--mono); color: var(--brand-dark); width: 58px; flex: none; }
  .mine b { font-size: 17px; }
  .mine b + .visits { margin-left: 8px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .av { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22);
    display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .days { position: absolute; left: 40px; right: 40px; bottom: 40px; }
  .days .strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .day { min-height: 70px; border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); display: grid; place-content: center; text-align: center;
    font: 600 22px var(--sans); color: var(--ink); }
  .day small { display: block; font: 600 12px var(--sans); color: var(--ink-2); }
  .day.on { border: 3px solid var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
  .day.sun, .day.sun small { color: var(--alert); }
  .day.cal { font-size: 14px; color: var(--brand); }
</style>
</head>
<body>
<div class="caption">
  <h1>トップ（個人の端末）</h1>
  <p>スタッフが自分で持つ iPad のトップ。共有端末との違いは、操作者が確定していることと、自分の担当が最初に見えること。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>11:08</span><span>EYEX 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="トップへ">⌂</button>
    <div class="storename">EYEX 銀座店<small>営業中　10:00–19:00</small></div>
    <div class="barbtns">
      <div class="who"><span class="av" aria-hidden="true">佐</span>
        <span style="font-size:14px;line-height:1.3">佐藤 美咲<br><span style="opacity:.85;font-size:11px">個人の端末</span></span></div>
      <button class="barbtn"><b>お知らせ</b><span class="badge">2</span></button>
      <button class="barbtn"><b>業務を終える</b></button>
    </div>
  </header>

  <div class="body">
    <div class="shell">
      <nav class="sidenav" aria-label="画面の切り替え">
        <button class="navtoggle" aria-label="サイドバーをたたむ">たたむ</button>
        <button class="nav-item on" data-icon="home">トップ</button>
        <button class="new">＋ 予約を取る</button>
        <button class="nav-item" data-icon="ledger">予約台帳</button>
        <button class="nav-item" data-icon="reception">来店受付</button>
        <button class="nav-item" data-icon="search">予約を検索</button>
        <button class="nav-item" data-icon="history">受付履歴</button>
        <button class="nav-item" data-icon="customer">顧客台帳</button>
        <div class="group">お店の運用</div>
        <button class="nav-item" data-icon="analytics">分析</button>
        <button class="nav-item" data-icon="settings">設定</button>
        <div class="foot">佐藤 美咲の iPad<br>個人で使っています</div>
      </nav>

      <div class="content">
        <div class="inner">
          <div class="home">
            <div class="hero">
              <button class="big"><span class="ico" aria-hidden="true">☎</span><span>新しい予約を取る<small>お電話・ご来店のお客様</small></span></button>
              <button class="big change"><span class="ico" aria-hidden="true">✎</span><span>予約を変更する<small>日時・内容の変更、取り消し</small></span></button>
            </div>

            <section class="mine" aria-label="本日のわたしの担当">
              <h3>本日わたしが担当するご予約　4件</h3>
              <div class="lines">
                <div>
                  <span class="t">11:00</span>
                  <span><b>田中 花子 様</b><span class="visits many">4回目</span><br><span class="small muted">新調相談・視力測定</span></span>
                  <span class="tag brand right">ご案内中</span>
                </div>
                <div>
                  <span class="t">13:00</span>
                  <span><b>佐々木 亮 様</b><span class="visits many">3回目</span><br><span class="small muted">フィッティング</span></span>
                </div>
                <div>
                  <span class="t">14:00</span>
                  <span><b>松本 一郎 様</b><span class="visits many">7回目</span><br><span class="small muted">できあがりの受け取り</span></span>
                </div>
                <div>
                  <span class="t">15:30</span>
                  <span><b>山口 真央 様</b><span class="visits first">初めて</span><br><span class="small muted">視力測定だけ</span></span>
                </div>
              </div>
            </section>
          </div>

          <div class="days">
            <div class="strip">
              <button class="day"><small>月</small>24</button>
              <button class="day"><small>火</small>25</button>
              <button class="day"><small>水</small>26</button>
              <button class="day on"><small>木</small>27</button>
              <button class="day"><small>金</small>28</button>
              <button class="day"><small>土</small>29</button>
              <button class="day sun"><small>日</small>30</button>
              <button class="day cal">カレンダー<br>から選ぶ</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
