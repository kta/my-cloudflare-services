<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — 分析（来店回数）</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .plabel { font-size: 13px; color: var(--ink-2); }
  .pbtn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); color: var(--ink); font: 600 15px var(--sans); }
  .apply { min-height: 44px; padding: 0 22px; font-size: 15px; }
  .an { height: 100%; padding: 32px 40px; display: grid; gap: 32px; align-content: start; }
  .card h3 { margin: 0 0 14px; font: 600 20px var(--sans); }
  .card h3 small { margin-left: 12px; font: 400 13px var(--sans); color: var(--ink-2); }
  .plotrow { display: flex; }
  .yaxis { position: relative; width: 40px; }
  .yaxis span { position: absolute; right: 10px; transform: translateY(50%); font-size: 13px; color: var(--ink-2); }
  .plotwrap { position: relative; flex: 1; }
  .gridlines { position: absolute; inset: 0; }
  .gridlines i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .gridlines i.base { border-top-color: var(--line-strong); }
  .chart { height: 200px; padding: 0; gap: 24px; border-bottom: 0; position: relative; z-index: 1; }
  .chart .bar { width: 74%; }
  .chart .xlab { left: 50%; transform: translateX(-50%); bottom: -26px; font-size: 13px; }
  .xspace { height: 28px; }
  .figs { display: grid; grid-template-columns: repeat(3, 1fr); }
  .figs .lb { display: block; margin-bottom: 4px; font-size: 13px; color: var(--ink-2); }
  .figs .vl { font-size: 16px; color: var(--ink-2); }
  .figs .vl b { font: 600 24px var(--mono); color: var(--ink); }
  .figs .vl b.txt { font: 600 22px var(--sans); }
</style>
</head>
<body>
<div class="caption">
  <h1>分析（来店回数）</h1>
  <p>どれくらい通ってくださるお客様が多いかを4つの回数帯で読む。グラフは1つ、下には全体と最も多い回数帯だけを添える。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>11:08</span><span>EYEX 銀座店</span><span>Wi‑Fi　100%</span></div>
  <header class="appbar"><button class="homebtn" aria-label="トップへ">⌂</button><div class="storename">EYEX 銀座店<small>分析</small></div></header>
  <div class="body"><div class="shell rail">
    <nav class="sidenav rail" aria-label="画面の切り替え">
      <button class="navtoggle" aria-label="サイドバーをたたむ">たたむ</button><button class="new">＋ 予約を取る</button>
      <button class="nav-item" data-icon="ledger">予約台帳</button><button class="nav-item" data-icon="reception">来店受付</button><button class="nav-item" data-icon="search">予約を検索</button><button class="nav-item" data-icon="history">受付履歴</button><button class="nav-item" data-icon="customer">顧客台帳</button><div class="group">お店の運用</div><button class="nav-item on" data-icon="analytics">分析</button><button class="nav-item" data-icon="settings">設定</button><div class="foot">銀座店 レジ横iPad<br>共有で使っています</div>
    </nav>
    <div class="content">
      <nav class="tabs" aria-label="分析の内訳を選ぶ"><button class="tab">トップ</button><button class="tab">予約数</button><button class="tab">予約の入口</button><button class="tab">取り消し</button><button class="tab on">来店回数</button><button class="tab">担当者</button><button class="tab">ご来店の目的</button><button class="tab">お待ち時間</button></nav>
      <div class="toolbar"><h2>来店回数</h2><span class="plabel">対象の期間</span><button class="pbtn">2026年 8月 ▾</button><button class="btn primary apply">適用</button><button class="pbtn right">店舗：銀座店 ▾</button></div>
      <div class="inner"><div class="an">
        <section class="card">
          <h3>来店回数ごとの受付<small>2026年8月／ご来店日を基準に、来店受付 328件を数えます</small></h3>
          <div class="plotrow"><div class="yaxis" aria-hidden="true"><span style="bottom:200px">120</span><span style="bottom:150px">90</span><span style="bottom:100px">60</span><span style="bottom:50px">30</span><span style="bottom:0">0</span></div>
            <div class="plotwrap"><div class="gridlines" aria-hidden="true"><i style="bottom:200px"></i><i style="bottom:150px"></i><i style="bottom:100px"></i><i style="bottom:50px"></i><i class="base" style="bottom:0"></i></div>
              <div class="chart" role="img" aria-label="来店回数ごとの受付件数。3〜5回が99件でもっとも多く、初めて90件、2回目88件、6回以上51件です。">
                <div class="col"><div class="bar" style="height:150px"></div><span class="xlab">初めて</span></div><div class="col"><div class="bar" style="height:147px"></div><span class="xlab">2回目</span></div><div class="col"><div class="bar" style="height:165px"></div><span class="xlab">3〜5回</span></div><div class="col"><div class="bar" style="height:85px"></div><span class="xlab">6回以上</span></div>
              </div>
            </div>
          </div><div class="xspace"></div>
        </section>
        <div class="figs"><div><span class="lb">8月の合計</span><span class="vl"><b>328</b> 件</span></div><div><span class="lb">最も多い回数帯</span><span class="vl"><b class="txt">3〜5回</b>　99 件</span></div><div><span class="lb">その割合</span><span class="vl"><b>30.2</b> %</span></div></div>
      </div></div>
    </div>
  </div></div>
</main>
</body>
</html>
