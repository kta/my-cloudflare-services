<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — 業務を始める（個人の端末・名前を選ぶ）</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .pick { height: 100%; padding: 40px 44px; }
  .tiles { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .tile {
    display: flex; align-items: center; gap: 16px; text-align: left;
    min-height: 116px; padding: 16px 20px;
    border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font-family: var(--sans);
  }
  .tile .av {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    background: var(--brand-tint); border: 1px solid var(--brand-line); color: var(--brand-dark);
    display: grid; place-items: center; font: 700 20px var(--sans);
  }
  .tile .nm { font-size: 17px; font-weight: 700; }
  .tile .sub { display: block; margin-top: 5px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .tile:disabled { background: var(--surface-2); color: var(--ink-3); border-style: dashed; }
  .tile:disabled .av { background: var(--busy); border-color: var(--line-strong); color: var(--ink-3); }
  .tile:disabled .sub { color: var(--ink-3); }
</style>
</head>
<body>
<div class="caption">
  <h1>業務を始める（個人の端末・名前を選ぶ）</h1>
  <p>個人の iPad で最初に通る画面。名前・できること・本日の勤務を並べ、休みの人は押せないことを文字でも示す。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>9:41</span><span>EYEX 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <div class="storename">EYEX 銀座店<small>業務を始める　個人の端末</small></div>
    <div class="barbtns">
      <button class="barbtn"><b>2026年8月27日（木）</b>本日</button>
      <button class="barbtn"><b>設定</b></button>
    </div>
  </header>

  <div class="body">
    <div class="pick">
      <div class="ask">
        <span class="bubble" aria-hidden="true"></span>
        <div>
          <h2>業務を始めるスタッフを選んでください</h2>
          <p>選んだ方の名前が、この日の記録に残ります。</p>
        </div>
      </div>

      <div class="tiles" role="group" aria-label="業務を始めるスタッフ">
        <button class="tile">
          <span class="av" aria-hidden="true">佐</span>
          <span><span class="nm">佐藤 美咲</span><span class="sub">視力測定・加工　10:00–19:00</span></span>
        </button>

        <button class="tile">
          <span class="av" aria-hidden="true">高</span>
          <span><span class="nm">高橋 健</span><span class="sub">フィッティング　10:00–19:00</span></span>
        </button>

        <button class="tile">
          <span class="av" aria-hidden="true">中</span>
          <span><span class="nm">中村 彩</span><span class="sub">販売・受付　10:00–16:00</span></span>
        </button>

        <button class="tile">
          <span class="av" aria-hidden="true">小</span>
          <span><span class="nm">小林 学</span><span class="sub">視力測定　13:00–19:00</span></span>
        </button>

        <button class="tile">
          <span class="av" aria-hidden="true">渡</span>
          <span><span class="nm">渡辺 由紀</span><span class="sub">販売　10:00–19:00</span></span>
        </button>

        <button class="tile" disabled>
          <span class="av" aria-hidden="true">山</span>
          <span><span class="nm">山田 大輔（店長）</span><span class="sub">店舗の管理　本日休み</span></span>
        </button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
