<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — Web予約 6/6 完了</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .wrap { padding: 32px 28px 140px; }
  .done { text-align: center; }
  .done .mark {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%;
    background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; font-size: 28px; font-weight: 700;
  }
  .done h2 { margin: 0; font-size: 20px; }
  .done p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
  .num { margin: 28px 0 0; padding: 16px 12px; text-align: center; }
  .num .lb { font-size: 13px; color: var(--ink-2); }
  .num b { display: block; margin-top: 4px; font: 700 24px var(--mono); color: var(--brand-dark); letter-spacing: 0.04em; }
  .detail { margin: 24px 0 0; }
  .detail > div { display: flex; gap: 14px; }
  .detail dt { flex: none; width: 66px; font-size: 13px; color: var(--ink-2); }
  .detail dd { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  .sticky { left: 28px; right: 28px; bottom: 32px; }
  .sticky .btn { width: 100%; }
  .sticky .quiet { margin-top: 8px; min-height: 44px; font-size: 16px; }
</style>
</head>
<body>
<div class="caption">
  <h1>Web予約 6/6　完了</h1>
  <p>予約が取れたことを最初に伝え、ご予約番号・ご来店の内容・道順・取り消し口だけをこの1画面に残す。</p>
</div>

<main class="phone" id="screen">
  <div class="statusbar"><span>11:15</span><span></span><span>Wi‑Fi　86%</span></div>

  <header class="appbar">
    <div class="storename" style="padding-left:4px">EYEX 銀座店<small>ステップ 6 / 6　ご予約が完了しました</small></div>
  </header>

  <div class="webprogress" role="img" aria-label="全6ステップが終わりました">
    <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="done">
        <div class="mark" aria-hidden="true">✓</div>
        <h2>ご予約が完了しました</h2>
        <p>確認のメールをお送りしました。</p>
      </div>

      <div class="card tint num">
        <span class="lb">ご予約番号</span>
        <b>EY-W-2608-0031</b>
      </div>

      <dl class="lines detail">
        <div><dt>ご来店</dt><dd>2026年8月29日（土）11:00</dd></div>
        <div><dt>店舗</dt><dd>EYEX 銀座店</dd></div>
        <div><dt>ご用件</dt><dd>メガネを新しく作る（約60分）</dd></div>
        <div><dt>お名前</dt><dd>山口 真央 様</dd></div>
      </dl>
    </div>

    <div class="sticky">
      <button class="btn primary big">地図・道順を見る</button>
      <button class="btn quiet">予約を変更・取り消す</button>
    </div>
  </div>
</main>
</body>
</html>
