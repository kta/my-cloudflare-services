<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — Web予約 4/6 お客様の情報</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .ask h2 { font-size: 20px; }
  .ask p { font-size: 13px; }
  .ask .bubble { width: 18px; height: 15px; margin-top: 6px; }
  .wrap { padding: 32px 28px 120px; }
  .fields { display: grid; gap: 20px; margin-top: 28px; }
  .f .label { font-size: 13px; }
  .f .field { min-height: 52px; font-size: 16px; }
  .sticky { left: 28px; right: 28px; bottom: 32px; }
  .sticky .btn { width: 100%; }
</style>
</head>
<body>
<div class="caption">
  <h1>Web予約 4/6　お客様の情報</h1>
  <p>当日お呼びするお名前と、行き違いのときの連絡先だけを伺う。</p>
</div>

<main class="phone" id="screen">
  <div class="statusbar"><span>11:12</span><span></span><span>Wi‑Fi　86%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="前の画面へ戻る">‹</button>
    <div class="storename">EYEX 銀座店<small>ステップ 4 / 6　お客様の情報</small></div>
  </header>

  <div class="webprogress" role="img" aria-label="全6ステップのうち4つ目です">
    <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="ask">
        <span class="bubble" aria-hidden="true"></span>
        <div>
          <h2>お客様のことを教えてください</h2>
          <p>ご予約のご連絡だけに使わせていただきます。</p>
        </div>
      </div>

      <div class="fields">
        <div class="f">
          <span class="label">お名前</span>
          <div class="field on">山口 真央</div>
        </div>
        <div class="f">
          <span class="label">ふりがな</span>
          <div class="field">やまぐち まお</div>
        </div>
        <div class="f">
          <span class="label">お電話番号</span>
          <div class="field">080-2345-6789</div>
        </div>
        <div class="f">
          <span class="label">メールアドレス</span>
          <div class="field">m.yamaguchi@example.jp</div>
        </div>
      </div>
    </div>

    <div class="sticky">
      <button class="btn primary big">入力内容を確認する</button>
    </div>
  </div>
</main>
</body>
</html>
