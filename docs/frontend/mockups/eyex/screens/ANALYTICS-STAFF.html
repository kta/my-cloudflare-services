<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYEX予約 — 分析（担当者）</title>
<link rel="stylesheet" href="../assets/eyex.css">
<style>
  .plabel { font-size: 13px; color: var(--ink-2); }
  .pbtn {
    min-height: 44px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: var(--r-m);
    background: var(--surface); color: var(--ink); font: 600 15px var(--sans);
  }
  .apply { min-height: 44px; padding: 0 22px; font-size: 15px; }

  .an { height: 100%; padding: 32px 40px; display: grid; align-content: start; }

  .card h3 { margin: 0 0 4px; font: 600 20px var(--sans); }
  .card h3 small { margin-left: 12px; font: 400 13px var(--sans); color: var(--ink-2); }

  /* 担当者ごとの件数。1つの並びに件数と再来をまとめる。 */
  .sr { display: grid; grid-template-columns: 290px 1fr 108px 140px; align-items: center; gap: 20px; }
  .sr .nm { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .sr .nm small { margin-left: 10px; font: 400 13px var(--sans); color: var(--ink-2); }
  .sr .track { height: 18px; background: var(--surface-2); border-radius: 4px; }
  .sr .track i { display: block; height: 18px; background: var(--brand); border-radius: 4px; }
  .sr .track i.none { background: var(--alert); }
  .sr .vl { text-align: right; font: 600 20px var(--mono); }
  .sr .vl em { margin-left: 5px; font: 400 13px var(--sans); font-style: normal; color: var(--ink-2); }
  .sr .re { text-align: right; font: 400 16px var(--sans); color: var(--ink-2); }
  .sr.head { padding-top: 4px; padding-bottom: 10px; }
  .sr.head span { font-size: 13px; font-weight: 400; color: var(--ink-2); text-align: right; }
  .sr.head span:first-child { text-align: left; }
  .sr.undecided .nm, .sr.undecided .vl { color: var(--alert); }
</style>
</head>
<body>
<div class="caption">
  <h1>分析（担当者）</h1>
  <p>だれに仕事が寄っているか。件数の横棒1本に、再来の割合まで載せて1つの並びで読む。</p>
</div>

<main class="device" id="screen">
  <div class="statusbar"><span>11:08</span><span>EYEX 銀座店</span><span>Wi‑Fi　100%</span></div>

  <header class="appbar">
    <button class="homebtn" aria-label="トップへ">⌂</button>
    <div class="storename">EYEX 銀座店<small>分析</small></div>
    <div class="barbtns"><button class="barbtn"><b>お知らせ</b><span class="badge">3</span></button></div>
  </header>

  <div class="body">
    <div class="shell rail">
      <nav class="sidenav rail" aria-label="画面の切り替え">
        <button class="navtoggle" aria-label="サイドバーをたたむ">たたむ</button>
        <button class="new">＋ 予約を取る</button>
        <button class="nav-item" data-icon="ledger">予約台帳</button>
        <button class="nav-item" data-icon="reception">来店受付</button>
        <button class="nav-item" data-icon="search">予約を検索</button>
        <button class="nav-item" data-icon="history">受付履歴</button>
        <button class="nav-item" data-icon="customer">顧客台帳</button>
        <div class="group">お店の運用</div>
        <button class="nav-item on" data-icon="analytics">分析</button>
        <button class="nav-item" data-icon="settings">設定</button>
        <div class="foot">銀座店 レジ横iPad<br>共有で使っています</div>
      </nav>

      <div class="content">
        <nav class="tabs" aria-label="分析の内訳を選ぶ">
          <button class="tab">トップ</button>
          <button class="tab">予約数</button>
          <button class="tab">予約の入口</button>
          <button class="tab">取り消し</button>
          <button class="tab">来店回数</button>
          <button class="tab on">担当者</button>
          <button class="tab">ご来店の目的</button>
          <button class="tab">お待ち時間</button>
        </nav>

        <div class="toolbar">
          <h2>担当者</h2>
          <span class="plabel">対象の期間</span>
          <button class="pbtn">2026年 8月 ▾</button>
          <button class="btn primary apply">適用</button>
          <button class="pbtn right">店舗：銀座店 ▾</button>
        </div>

        <div class="inner">
          <div class="an">
            <section class="card">
              <h3>担当者ごとの件数<small>2026年8月／ご来店日でかぞえます　合計 328件</small></h3>
              <div class="lines">
                <div class="sr head" aria-hidden="true">
                  <span>担当者</span><span></span><span>件数</span><span>90日以内の再来</span>
                </div>
                <div class="sr">
                  <span class="nm">佐藤 美咲<small>視力測定・加工</small></span>
                  <span class="track"><i style="width:100%"></i></span>
                  <span class="vl">78<em>件</em></span><span class="re">68%</span>
                </div>
                <div class="sr">
                  <span class="nm">中村 彩<small>販売・受付</small></span>
                  <span class="track"><i style="width:91%"></i></span>
                  <span class="vl">71<em>件</em></span><span class="re">61%</span>
                </div>
                <div class="sr">
                  <span class="nm">高橋 健<small>フィッティング</small></span>
                  <span class="track"><i style="width:79.5%"></i></span>
                  <span class="vl">62<em>件</em></span><span class="re">57%</span>
                </div>
                <div class="sr">
                  <span class="nm">渡辺 由紀<small>販売</small></span>
                  <span class="track"><i style="width:62.8%"></i></span>
                  <span class="vl">49<em>件</em></span><span class="re">49%</span>
                </div>
                <div class="sr">
                  <span class="nm">小林 学<small>視力測定</small></span>
                  <span class="track"><i style="width:52.6%"></i></span>
                  <span class="vl">41<em>件</em></span><span class="re">44%</span>
                </div>
                <div class="sr">
                  <span class="nm">山田 大輔<small>店長</small></span>
                  <span class="track"><i style="width:23.1%"></i></span>
                  <span class="vl">18<em>件</em></span><span class="re">52%</span>
                </div>
                <div class="sr undecided">
                  <span class="nm">担当が未定<small>受付では未定</small></span>
                  <span class="track"><i class="none" style="width:11.5%"></i></span>
                  <span class="vl">9<em>件</em></span><span class="re">—</span>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
